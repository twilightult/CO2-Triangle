name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        run: |
          mkdir -p Payload/Triangle.app
          xcrun -sdk iphoneos clang -arch arm64 \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -O2 \
            -framework UIKit -framework Metal -framework MetalKit -framework QuartzCore \
            triangle.m -o Payload/Triangle.app/Triangle
          cp Info.plist Payload/Triangle.app/
          chmod +x Payload/Triangle.app/Triangle

      - name: Verify
        run: |
          file Payload/Triangle.app/Triangle
          ls -la Payload/Triangle.app/

      - name: Package
        run: |
          cd Payload && zip -qry ../Triangle.ipa Triangle.app

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Triangle-ipa
          path: Triangle.ipa
